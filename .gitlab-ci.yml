stages:
  - quality
  - test

default:
  image: python:3.13-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt

quality:
  stage: quality
  script:
    - python -m pip check
    - python -m ruff check .
    - python -m ruff format --check .

tests:
  stage: test
  script:
    - python -m pytest -v